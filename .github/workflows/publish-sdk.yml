name: Publish SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag（默认 latest）'
        required: false
        default: 'latest'

permissions:
  contents: read
  # 若改用 npm Trusted Publishing（OIDC），需保留 id-token: write
  id-token: write

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish @fe-monitor/sdk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          always-auth: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build:sdk

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG 与 packages/sdk/package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi
          echo "Publishing @fe-monitor/sdk@$PKG_VERSION"

      - name: Check NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::缺少 Secrets.NPM_TOKEN。请到仓库 Settings → Secrets and variables → Actions 新增 NPM_TOKEN（npm Access Token，Automation 类型，需有 publish 权限）。"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          DIST_TAG="${{ github.event.inputs.dist_tag || 'latest' }}"

          # 显式写入鉴权，避免仅依赖 setup-node 生成的 .npmrc
          printf '%s\n' \
            "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
            "registry=https://registry.npmjs.org/" \
            "always-auth=true" > .npmrc

          # pack + npm publish：鉴权比直接 pnpm publish 更稳定
          pnpm pack
          TARBALL="$(ls fe-monitor-sdk-*.tgz | head -n 1)"
          npm publish "$TARBALL" --access public --tag "$DIST_TAG"
          rm -f .npmrc fe-monitor-sdk-*.tgz
