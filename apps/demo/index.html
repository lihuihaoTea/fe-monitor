<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前端监控 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .status {
      padding: 12px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      margin-bottom: 30px;
      color: #15803d;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #333;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: #667eea;
      color: white;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .danger {
      background: #ef4444;
    }

    .danger:hover {
      background: #dc2626;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .info {
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }

    code {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 前端监控 Demo</h1>
    <p class="subtitle">测试各种监控功能</p>

    <div class="status">
      ✅ 监控 SDK 已初始化 (App ID: demo-app)
    </div>

    <div class="section">
      <h2>错误监控</h2>
      <div class="button-grid">
        <button onclick="triggerError()" class="danger">触发 JS 错误</button>
        <button onclick="triggerPromiseError()" class="danger">触发 Promise 错误</button>
        <button onclick="triggerResourceError()" class="danger">触发资源加载错误</button>
      </div>
    </div>

    <div class="section">
      <h2>API 监控</h2>
      <div class="button-grid">
        <button onclick="triggerFetch404()" class="danger">Fetch 404 错误</button>
        <button onclick="triggerXHR500()" class="danger">XHR 500 错误</button>
        <button onclick="triggerNetworkError()" class="danger">网络错误</button>
      </div>
    </div>

    <div class="section">
      <h2>用户行为</h2>
      <div class="button-grid">
        <button onclick="trackCustomEvent()">自定义事件</button>
        <button onclick="window.location.reload()">刷新页面 (PV+1)</button>
      </div>
    </div>

    <div class="info">
      <strong>📊 查看数据：</strong><br>
      打开管理后台 <code>http://localhost:3000</code> 查看实时监控数据<br>
      <br>
      <strong>💡 提示：</strong><br>
      • 页面访问和停留时长会自动记录<br>
      • 性能指标（FCP、LCP）已自动收集<br>
      • 点击任意按钮都会增加点击计数<br>
      • 数据每 5 秒或累计 10 条自动上报
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
